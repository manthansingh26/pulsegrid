zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - mkdir -p ../../home/zerops/.local/bin
        - echo '#!/bin/sh' > ../../home/zerops/.local/bin/cd
        - echo 'DIR="$1"' >> ../../home/zerops/.local/bin/cd
        - echo 'shift 2' >> ../../home/zerops/.local/bin/cd
        - echo 'cd "$DIR" && exec "$@"' >> ../../home/zerops/.local/bin/cd
        - chmod +x ../../home/zerops/.local/bin/cd
        - cd apps/api && npm ci
        - cd apps/api && npm run build
      deployFiles:
        - ../../home/zerops/.local/bin/cd
        - apps/api/dist
        - apps/api/package.json
        - apps/api/package-lock.json
        - apps/api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node apps/api/dist/index.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - mkdir -p ../../home/zerops/.local/bin
        - echo '#!/bin/sh' > ../../home/zerops/.local/bin/cd
        - echo 'DIR="$1"' >> ../../home/zerops/.local/bin/cd
        - echo 'shift 2' >> ../../home/zerops/.local/bin/cd
        - echo 'cd "$DIR" && exec "$@"' >> ../../home/zerops/.local/bin/cd
        - chmod +x ../../home/zerops/.local/bin/cd
        - cd apps/worker && npm ci
        - cd apps/worker && npm run build
      deployFiles:
        - ../../home/zerops/.local/bin/cd
        - apps/worker/dist
        - apps/worker/package.json
        - apps/worker/package-lock.json
        - apps/worker/node_modules
    run:
      base: nodejs@22
      start: node apps/worker/dist/index.js

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - mkdir -p ../../home/zerops/.local/bin
        - echo '#!/bin/sh' > ../../home/zerops/.local/bin/cd
        - echo 'DIR="$1"' >> ../../home/zerops/.local/bin/cd
        - echo 'shift 2' >> ../../home/zerops/.local/bin/cd
        - echo 'cd "$DIR" && exec "$@"' >> ../../home/zerops/.local/bin/cd
        - chmod +x ../../home/zerops/.local/bin/cd
        - cd apps/frontend && npm ci
        - cd apps/frontend && npm run build
      deployFiles:
        - ../../home/zerops/.local/bin/cd
        - apps/frontend/dist
        - apps/frontend/package.json
        - apps/frontend/package-lock.json
        - apps/frontend/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npx serve -s apps/frontend/dist -l 3000
