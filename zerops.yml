zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - mkdir -p ../../../usr/local/bin ../../usr/local/bin ../.local/bin node_modules/.bin apps/api/node_modules/.bin 2>/dev/null || true
        - echo '#!/bin/sh' > cd
        - echo 'DIR="$1"' >> cd
        - echo 'shift 2' >> cd
        - echo 'cd "$DIR" && exec "$@"' >> cd
        - chmod +x cd
        - cp cd ../../../usr/local/bin/cd 2>/dev/null || true
        - cp cd ../../usr/local/bin/cd 2>/dev/null || true
        - cp cd ../.local/bin/cd 2>/dev/null || true
        - cp cd node_modules/.bin/cd 2>/dev/null || true
        - cp cd apps/api/node_modules/.bin/cd 2>/dev/null || true
        - chmod +x cd ../../../usr/local/bin/cd ../../usr/local/bin/cd ../.local/bin/cd node_modules/.bin/cd apps/api/node_modules/.bin/cd 2>/dev/null || true
        - cd apps/api && npm ci
        - cd apps/api && npm run build
      deployFiles:
        - cd
        - ../../../usr/local/bin/cd
        - ../../usr/local/bin/cd
        - ../.local/bin/cd
        - node_modules/.bin/cd
        - apps/api/node_modules/.bin/cd
        - apps/api/dist
        - apps/api/package.json
        - apps/api/package-lock.json
        - apps/api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node apps/api/dist/index.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health

  - setup: worker
    build:
      base: nodejs@22
      buildCommands:
        - mkdir -p ../../../usr/local/bin ../../usr/local/bin ../.local/bin node_modules/.bin apps/worker/node_modules/.bin 2>/dev/null || true
        - echo '#!/bin/sh' > cd
        - echo 'DIR="$1"' >> cd
        - echo 'shift 2' >> cd
        - echo 'cd "$DIR" && exec "$@"' >> cd
        - chmod +x cd
        - cp cd ../../../usr/local/bin/cd 2>/dev/null || true
        - cp cd ../../usr/local/bin/cd 2>/dev/null || true
        - cp cd ../.local/bin/cd 2>/dev/null || true
        - cp cd node_modules/.bin/cd 2>/dev/null || true
        - cp cd apps/worker/node_modules/.bin/cd 2>/dev/null || true
        - chmod +x cd ../../../usr/local/bin/cd ../../usr/local/bin/cd ../.local/bin/cd node_modules/.bin/cd apps/worker/node_modules/.bin/cd 2>/dev/null || true
        - cd apps/worker && npm ci
        - cd apps/worker && npm run build
      deployFiles:
        - cd
        - ../../../usr/local/bin/cd
        - ../../usr/local/bin/cd
        - ../.local/bin/cd
        - node_modules/.bin/cd
        - apps/worker/node_modules/.bin/cd
        - apps/worker/dist
        - apps/worker/package.json
        - apps/worker/package-lock.json
        - apps/worker/node_modules
    run:
      base: nodejs@22
      start: node apps/worker/dist/index.js

  - setup: frontend
    build:
      base: nodejs@22
      buildCommands:
        - mkdir -p ../../../usr/local/bin ../../usr/local/bin ../.local/bin node_modules/.bin apps/frontend/node_modules/.bin 2>/dev/null || true
        - echo '#!/bin/sh' > cd
        - echo 'DIR="$1"' >> cd
        - echo 'shift 2' >> cd
        - echo 'cd "$DIR" && exec "$@"' >> cd
        - chmod +x cd
        - cp cd ../../../usr/local/bin/cd 2>/dev/null || true
        - cp cd ../../usr/local/bin/cd 2>/dev/null || true
        - cp cd ../.local/bin/cd 2>/dev/null || true
        - cp cd node_modules/.bin/cd 2>/dev/null || true
        - cp cd apps/frontend/node_modules/.bin/cd 2>/dev/null || true
        - chmod +x cd ../../../usr/local/bin/cd ../../usr/local/bin/cd ../.local/bin/cd node_modules/.bin/cd apps/frontend/node_modules/.bin/cd 2>/dev/null || true
        - cd apps/frontend && npm ci
        - cd apps/frontend && npm run build
      deployFiles:
        - cd
        - ../../../usr/local/bin/cd
        - ../../usr/local/bin/cd
        - ../.local/bin/cd
        - node_modules/.bin/cd
        - apps/frontend/node_modules/.bin/cd
        - apps/frontend/dist
        - apps/frontend/package.json
        - apps/frontend/package-lock.json
        - apps/frontend/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npx serve -s apps/frontend/dist -l 3000
